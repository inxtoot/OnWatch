name: 打包 EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [published]   # ★ 新增：当 Release 发布时触发

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install requests pynput packaging certifi

    - name: 使用 PyInstaller 打包（带图标）
      run: |
        pyinstaller --onefile --name OnWatch --windowed --icon=001.ico run.py

    - name: 上传 EXE 作为工件（Artifact）
      uses: actions/upload-artifact@v4
      with:
        name: OnWatch-Windows
        path: dist/OnWatch.exe

    - name: 自动上传到 Release（当 Release 发布时）
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: dist/OnWatch.exe
        asset_name: OnWatch.exe
        asset_content_type: application/octet-stream