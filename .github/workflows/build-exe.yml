name: 打包 EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest  # 使用 Windows 运行器

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install requests pynput packaging

    - name: 使用 PyInstaller 打包
      run: |
        pyinstaller --onefile --name OnWatch --windowed run.py

    - name: 上传 EXE 作为工件（Artifact）
      uses: actions/upload-artifact@v4
      with:
        name: OnWatch-Windows
        path: dist/OnWatch.exe

    - name: 创建 Release 并上传 EXE（仅当推送 tag 时触发）
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/OnWatch.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}