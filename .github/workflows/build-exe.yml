name: Build EXE and Auto-Release

on:
  push:
    tags:
      - 'v*'  # 只要推送以 v 开头的 tag（如 v1.7.1），就自动触发

permissions:
  contents: write  # 允许创建 Release 和上传附件

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pynput packaging certifi pyinstaller

      - name: Build EXE with PyInstaller
        shell: pwsh  # 使用 PowerShell 以便获取 certifi 路径
        run: |
          # 获取 certifi 证书路径，解决 SSL 问题
          $cert_path = python -c "import certifi; print(certifi.where())"
          echo "证书路径: $cert_path"
          pyinstaller -F -w -n "OnWatch_${{ github.ref_name }}" --icon=001.ico --add-data "$cert_path;certifi" run.py

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/OnWatch_${{ github.ref_name }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}